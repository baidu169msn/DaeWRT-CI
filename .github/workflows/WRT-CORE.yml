name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG: {required: true, type: string}
      WRT_THEME: {required: true, type: string}
      WRT_NAME: {required: true, type: string}
      WRT_SSID: {required: true, type: string}
      WRT_WORD: {required: true, type: string}
      WRT_IP: {required: true, type: string}
      WRT_PW: {required: true, type: string}
      WRT_REPO: {required: true, type: string}
      WRT_BRANCH: {required: true, type: string}
      WRT_SOURCE: {required: false, type: string}
      WRT_PACKAGE: {required: false, type: string}
      WRT_TEST: {required: false, type: string}
      CI_NAME: {required: false, type: string}
      WRT_ARCH: {required: false, type: string}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WRT_CONFIG: ${{ inputs.WRT_CONFIG }}
  WRT_THEME: ${{ inputs.WRT_THEME }}
  WRT_NAME: ${{ inputs.WRT_NAME }}
  WRT_SSID: ${{ inputs.WRT_SSID }}
  WRT_WORD: ${{ inputs.WRT_WORD }}
  WRT_IP: ${{ inputs.WRT_IP }}
  WRT_PW: ${{ inputs.WRT_PW }}
  WRT_REPO: ${{ inputs.WRT_REPO }}
  WRT_BRANCH: ${{ inputs.WRT_BRANCH }}
  WRT_SOURCE: ${{ inputs.WRT_SOURCE }}
  WRT_PACKAGE: ${{ inputs.WRT_PACKAGE }}
  WRT_TEST: ${{ inputs.WRT_TEST }}
  WRT_DIR: 'wrt'
  CI_NAME: ${{ inputs.CI_NAME }}
  WRT_ARCH: ${{ inputs.WRT_ARCH }}
  CLANG: clang
  LLVM_STRIP: llvm-strip

jobs:
  core:
    name: ${{ inputs.WRT_SOURCE }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Free Disk Space & Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/chromium /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          
          # 基础依赖（不含 llvm 元包，避免虚拟包/空包问题）
          sudo apt-get install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget qemu-utils libelf-dev bc dos2unix libfuse-dev dwarves libbpf-dev
          
          # 【核心修复】显式安装版本化 clang-18/llvm-18（llvm-strip-18 随 llvm-18 提供）
          sudo apt-get install -y clang-18 llvm-18 || sudo apt-get install -y clang llvm
          
          # 多层探测 clang
          CLANG_BIN=$(ls /usr/bin/clang-[0-9]* 2>/dev/null | sort -V | tail -n 1)
          [ -z "$CLANG_BIN" ] && CLANG_BIN=$(ls /usr/lib/llvm-*/bin/clang 2>/dev/null | head -n 1)
          [ -z "$CLANG_BIN" ] && CLANG_BIN=$(which clang 2>/dev/null)
          
          # 多层探测 llvm-strip：/usr/bin -> dpkg 查询 -> llvm 目录
          STRIP_BIN=$(ls /usr/bin/llvm-strip-[0-9]* 2>/dev/null | sort -V | tail -n 1)
          [ -z "$STRIP_BIN" ] && STRIP_BIN=$(dpkg -L llvm-18 2>/dev/null | grep -E '/llvm-strip(-[0-9]+)?$' | head -n 1)
          [ -z "$STRIP_BIN" ] && STRIP_BIN=$(ls /usr/lib/llvm-*/bin/llvm-strip 2>/dev/null | head -n 1)
          
          # 终极兜底：用 llvm-objcopy 生成 llvm-strip 包装器
          if [ -z "$STRIP_BIN" ]; then
            OBJCOPY_BIN=$(ls /usr/bin/llvm-objcopy-[0-9]* 2>/dev/null | sort -V | tail -n 1)
            [ -z "$OBJCOPY_BIN" ] && OBJCOPY_BIN=$(ls /usr/lib/llvm-*/bin/llvm-objcopy 2>/dev/null | head -n 1)
            if [ -n "$OBJCOPY_BIN" ]; then
              printf '#!/bin/sh\nexec "%s" --strip-all "$@"\n' "$OBJCOPY_BIN" | sudo tee /usr/bin/llvm-strip >/dev/null
              sudo chmod +x /usr/bin/llvm-strip
              STRIP_BIN=/usr/bin/llvm-strip
            fi
          fi
          
          if [ -n "$CLANG_BIN" ]; then
            echo "Found clang: $CLANG_BIN"
            sudo ln -sf "$CLANG_BIN" /usr/bin/clang
          else
            echo "ERROR: clang not found!" && exit 1
          fi
          
          if [ -n "$STRIP_BIN" ]; then
            echo "Found llvm-strip: $STRIP_BIN"
            sudo ln -sf "$STRIP_BIN" /usr/bin/llvm-strip
          else
            echo "ERROR: llvm-strip not found!" && exit 1
          fi
          
          echo "Verifying with 'which' command:"
          which clang || (echo "which clang failed!" && exit 1)
          which llvm-strip || (echo "which llvm-strip failed!" && exit 1)
          llvm-strip --version || true
          
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=Asia/Shanghai date +"%y.%m.%d-%H.%M.%S")" >> "$GITHUB_ENV"
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> "$GITHUB_ENV"
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> "$GITHUB_ENV"
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?==y)' ./Config/$WRT_CONFIG.txt)" >> "$GITHUB_ENV"
          echo "WRT_KVER=none" >> "$GITHUB_ENV"
          echo "WRT_LIST=none" >> "$GITHUB_ENV"
          
          if [ -z "$WRT_ARCH" ]; then
            export WRT_ARCH=$(sed -n 's/^CONFIG_TARGET_DEVICE_.*_DEVICE_\([^=]*\)=y/\1/p' "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" | head -n 1)
            echo "WRT_ARCH=$WRT_ARCH" >> "$GITHUB_ENV"
          fi

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/
          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> "$GITHUB_ENV"

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/
          "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          "$GITHUB_WORKSPACE/Scripts/Handles.sh"

      - name: Custom Settings
        run: |
          . "$GITHUB_WORKSPACE/Scripts/function.sh"
          cd ./wrt/
          
          generate_config
          "$GITHUB_WORKSPACE/Scripts/Settings.sh"
          
          grep -rl "stdcountof.h" . 2>/dev/null | xargs -r sed -i 's|#include <stdcountof\.h>|#define countof(a) (sizeof(a) / sizeof(*(a)))|g' 2>/dev/null || true
          make defconfig
          
          echo "==================== final .config ===================="
          grep -Ei 'ath11k|ipq-wifi|wpad|dnsmasq|fullcone|qca-nss|daed' .config || true

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          make download -j8 || make download -j1 V=s

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          make -j$(($(nproc)+1)) || make -j1 V=s

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/
          cp -f ./.config "./upload/Config-$WRT_CONFIG-$WRT_INFO-$WRT_BRANCH-$WRT_DATE.txt"
          
          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name '*.manifest' -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> "$GITHUB_ENV"
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name '*.manifest' -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> "$GITHUB_ENV"
            
            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +
            
            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename "$FILE" | cut -d '.' -f 2-)
              NAME=$(basename "$FILE" | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*" || basename "$FILE" | cut -d '.' -f 1)
              NEW_FILE="$NAME-$WRT_DATE.$EXT"
              mv -f "$FILE" "./upload/$NEW_FILE"
            done
            
            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CI_NAME }}-${{ env.WRT_CONFIG }}_${{ env.WRT_INFO }}_${{ env.WRT_DATE }}
          files: ./wrt/upload/*.*
          body: |
            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}
            配置：${{ env.WRT_CONFIG }}
            平台：${{ env.WRT_TARGET }}
            设备：${{ env.WRT_ARCH }}
            内核版本：${{ env.WRT_KVER }}
            插件列表：${{ env.WRT_LIST }}