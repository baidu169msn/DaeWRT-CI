name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG: {required: true, type: string}
      WRT_THEME: {required: true, type: string}
      WRT_NAME: {required: true, type: string}
      WRT_SSID: {required: true, type: string}
      WRT_WORD: {required: true, type: string}
      WRT_IP: {required: true, type: string}
      WRT_PW: {required: true, type: string}
      WRT_REPO: {required: true, type: string}
      WRT_BRANCH: {required: true, type: string}
      WRT_SOURCE: {required: false, type: string}
      WRT_PACKAGE: {required: false, type: string}
      WRT_TEST: {required: false, type: string}
      CI_NAME: {required: false, type: string}
      WRT_ARCH: {required: false, type: string}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WRT_CONFIG: ${{ inputs.WRT_CONFIG }}
  WRT_THEME: ${{ inputs.WRT_THEME }}
  WRT_NAME: ${{ inputs.WRT_NAME }}
  WRT_SSID: ${{ inputs.WRT_SSID }}
  WRT_WORD: ${{ inputs.WRT_WORD }}
  WRT_IP: ${{ inputs.WRT_IP }}
  WRT_PW: ${{ inputs.WRT_PW }}
  WRT_REPO: ${{ inputs.WRT_REPO }}
  WRT_BRANCH: ${{ inputs.WRT_BRANCH }}
  WRT_SOURCE: ${{ inputs.WRT_SOURCE }}
  WRT_PACKAGE: ${{ inputs.WRT_PACKAGE }}
  WRT_TEST: ${{ inputs.WRT_TEST }}
  WRT_DIR: 'wrt'
  CI_NAME: ${{ inputs.CI_NAME }}
  WRT_ARCH: ${{ inputs.WRT_ARCH }}
  CLANG: clang
  LLVM_STRIP: llvm-strip

jobs:
  core:
    name: ${{ inputs.WRT_SOURCE }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Free Disk Space & Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/chromium /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          
          # 【绝对纯净版】已彻底移除导致报错的 bpftool
          sudo apt-get install -y build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget qemu-utils libelf-dev bc dos2unix libfuse-dev dwarves libbpf-dev
          
          echo "Searching for clang and llvm-strip..."
          CLANG_BIN=$(find /usr/bin /usr/lib/llvm-*/bin -type f \( -name "clang" -o -name "clang-[0-9]*" \) 2>/dev/null | sort -V | tail -n 1)
          STRIP_BIN=$(find /usr/bin /usr/lib/llvm-*/bin -type f \( -name "llvm-strip" -o -name "llvm-strip-[0-9]*" \) 2>/dev/null | sort -V | tail -n 1)
          
          if [ -z "$CLANG_BIN" ]; then CLANG_BIN=$(which clang 2>/dev/null); fi
          if [ -z "$STRIP_BIN" ]; then STRIP_BIN=$(which llvm-strip 2>/dev/null); fi
          
          if [ -n "$CLANG_BIN" ]; then
            sudo ln -sf "$CLANG_BIN" /usr/bin/clang
          else
            echo "ERROR: clang not found!" && exit 1
          fi
          
          if [ -n "$STRIP_BIN" ]; then
            sudo ln -sf "$STRIP_BIN" /usr/bin/llvm-strip
          else
            echo "ERROR: llvm-strip not found!" && exit 1
          fi
          
          which clang || (echo "which clang failed!" && exit 1)
          which llvm-strip || (echo "which llvm-strip failed!" && exit 1)
          
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=Asia/Shanghai date +"%y.%m.%d-%H.%M.%S")" >> "$GITHUB_ENV"
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> "$GITHUB_ENV"
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> "$GITHUB_ENV"
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?==y)' ./Config/$WRT_CONFIG.txt)" >> "$GITHUB_ENV"
          echo "WRT_KVER=none" >> "$GITHUB_ENV"
          echo "WRT_LIST=none" >> "$GITHUB_ENV"
          
          if [ -z "$WRT_ARCH" ]; then
            export WRT_ARCH=$(sed -n 's/^CONFIG_TARGET_DEVICE_.*_DEVICE_\([^=]*\)=y/\1/p' "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" | head -n 1)
            echo "WRT_ARCH=$WRT_ARCH" >> "$GITHUB_ENV"
          fi

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/
          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> "$GITHUB_ENV"

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/
          "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          "$GITHUB_WORKSPACE/Scripts/Handles.sh"

      - name: Custom Settings
        run: |
          . "$GITHUB_WORKSPACE/Scripts/function.sh"
          cd ./wrt/
          
          generate_config
          "$GITHUB_WORKSPACE/Scripts/Settings.sh"
          
          grep -rl "stdcountof.h" . 2>/dev/null